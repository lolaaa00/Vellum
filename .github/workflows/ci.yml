name: VELLUM CI
on:
  push:
  pull_request:
env:
  GENVM_VERSION: v0.6.0-rc6
  GENVM_SOURCE_MODE: release
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: genvm-lint check contracts/vellum.py
      - run: genvm-lint validate contracts/vellum.py
      - run: genvm-lint typecheck contracts/vellum.py
      - run: pytest tests/direct -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
